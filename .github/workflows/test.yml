name: Test

on:
    push:
        branches:
            - "**"
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - name: Update npm
              run: npm install -g npm@latest
            - run: npm ci
            - run: npm run lint
            - run: npm run test:coverage
